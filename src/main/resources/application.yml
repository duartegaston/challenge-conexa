spring:
  application:
    name: challenge-conexa
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

swapi:
  base-url: https://www.swapi.tech/api
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

cache:
  swapi:
    ttl-minutes: 5
    max-size: 300

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-phase1-demo-secret-must-be-long-enough-256bits}
      expiration-minutes: 60
    seed:
      user-password: ${SEED_USER_PASSWORD:user123}
      admin-password: ${SEED_ADMIN_PASSWORD:admin123}

---
# Perfil local: H2 en memoria (compatible PostgreSQL) + Flyway.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:challenge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: INFO
    com.conexa.challenge: DEBUG

---
# Perfil prod (Fly.io): H2 file-based para auth/seed. Sin Postgres managed de pago.
# Preferir volumen montado en /data (ver fly.toml). Sin volumen, el archivo vive en el disco
# efímero del contenedor: los users seed se recrean al arrancar si la DB está vacía.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:h2:file:${H2_FILE_PATH:/data/challenge};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    com.conexa.challenge: INFO

---
# Perfil test: H2 + Flyway para tests de integración.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:challenge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
