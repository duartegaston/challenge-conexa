spring:
  application:
    name: challenge-conexa
  profiles:
    default: local
  # H2 en memoria por defecto (local y tests). El perfil prod la reemplaza por H2 en archivo.
  datasource:
    url: jdbc:h2:mem:challenge;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo maneja Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true # errores como application/problem+json (RFC 7807)
  web:
    locale: en # mensajes de validación siempre en inglés, sin depender del idioma del SO
    locale-resolver: fixed
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

swapi:
  base-url: https://www.swapi.tech/api
  connect-timeout: 3s
  read-timeout: 5s
  cache:
    lists-ttl: 5m
    details-ttl: 1h # los detalles casi no cambian
    max-size: 300

app:
  security:
    jwt:
      expiration: 60m
    seed:
      enabled: true
      user-password: ${SEED_USER_PASSWORD:user123}
      admin-password: ${SEED_ADMIN_PASSWORD:admin123}

---
# Local: el secreto de abajo es SOLO para desarrollo. Puede pisarse con JWT_SECRET.
spring:
  config:
    activate:
      on-profile: local

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-secret-never-use-in-production-0123456789}

logging:
  level:
    com.conexa.challenge: DEBUG

---
# Prod (Fly.io): H2 en archivo. Sin JWT_SECRET la aplicación no arranca (no hay valor por defecto).
# Para que los usuarios registrados sobrevivan a un redeploy hay que montar un volumen en /data (ver fly.toml).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:h2:file:${H2_FILE_PATH:/data/challenge}
    password: ${H2_PASSWORD:}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
