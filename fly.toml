# Fly.io — Challenge Conexa
# Si el nombre está tomado: fly apps create <otro-nombre> y actualizar `app` abajo.
# Secretos (no van en este archivo):  fly secrets set JWT_SECRET="$(openssl rand -base64 48)"
app = "challenge-conexa"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistencia de usuarios (H2 en archivo). Sin volumen, los usuarios registrados se pierden en cada
# redeploy (los de seed se recrean solos). Para activarla:
#   fly volumes create challenge_data --region iad --size 1
# y descomentar:
# [[mounts]]
#   source = "challenge_data"
#   destination = "/data"
