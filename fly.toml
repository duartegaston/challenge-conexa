# Fly.io — Challenge Conexa
# Si el nombre está tomado: fly apps create <otro-nombre> y actualizar `app` abajo.
app = "challenge-conexa"
primary_region = "iad"

[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  H2_FILE_PATH = "/data/challenge"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistencia H2 (opcional, recomendado si el plan lo permite):
#   fly volumes create challenge_data --region iad --size 1
# Luego descomentar:
# [[mounts]]
#   source = "challenge_data"
#   destination = "/data"
